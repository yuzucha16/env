[Editor]
FontFamily        = "HackGen Console NF"
FontSize          = 12
LineHeight        = 1.15
Ligatures         = true           # 合字（Cascadia/JetBrains なら OK）
SmoothScroll      = true
Clipboard         = true           # Win のクリップボード連携
CursorSmoothMove  = false          # 体感差は小、切ると軽くなる
RenderItalic      = true
RenderBold        = true

#StartMaximizedWindow = false
#RestoreWindowGeometry = false
WindowX = 720        # ウィンドウの初期位置（左上座標、単位はピクセル）
WindowY = 50
WindowWidth  = 720   # ウィンドウの初期サイズ（単位はピクセル）
WindowHeight = 960

# 透過やぼかしは見栄えは良いが GPU/描画トラブルの温床なので常用はオフ
Transparent       = 1.0            # 1.0 = 不透明（安定）
Blur              = false

# === ウィンドウ/タイトルバー ===
BorderlessWindow  = false          # 標準枠を使う（Win11 スナップ/最大化/タスクバー連携が安定）
HideTitlebar      = false          # 同上。Win + ←/→ のスナップが利かない時の定番原因
RememberWindowPos = false          # 前回位置・サイズを復元
SnapResize        = true           # リサイズでカクつく時は false も試す

# タブ/分割の見た目（お好みだが軽め設定）
ShowTabline       = true
ShowStatusline    = true

# === 描画/パフォーマンス ===
TargetFPS         = 60             # 高すぎると無駄、60〜144で
DisableVSync      = false          # 画面裂けが出るなら false
CacheDraw         = true           # 文字キャッシュで軽量化
EmojiRender       = false          # 絵文字描画を切ると軽くなる

# === 入力/IME ===
UseIME            = true           # 日本語 IME
ImeInline         = true           # 行内候補。お好みで
# ImeFontFamily   = "Yu Gothic UI" # 候補表示を変えたいとき

[Scrollbar]
Visible = true
Width   = 6

[Neovim]
Path              = "nvim.exe"
# 起動引数（軽快重視：最小プラグイン起動に切り替えるテストにも使える）
# Args            = ["-u", "NONE", "--clean"]

# Neovim の UI 拡張（Goneovim は ext_* をネイティブ実装）
ExtPopupmenu      = true
ExtCmdline        = true
ExtMessages       = true
ExtTabline        = true
ExtWildmenu       = true
ExtLinegrid       = true           # ほぼ必須

[Workspace]
RestoreSession    = false          # 前回のバッファ/タブを復元
AutoChdir         = false

[Log]
Level             = "error"        # "debug" は重いので常用しない
